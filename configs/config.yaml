# Configuration for the drilling kick-detection research prototype.
# All paths are relative to the project root (the directory containing this file's parent).

project:
  name: "ML Early Warning Framework for Drilling Kick Detection"
  seed: 42
  version: "0.1.0"

data:
  raw_path: "data/raw/Kick_Detection.csv"
  processed_dir: "data/processed"
  source_url: "https://zenodo.org/records/12759014"
  expected_md5: "8bbd611ca9d66c397d43c61a152bed93"

# IMPORTANT: the source dataset does not contain an explicit binary class column.
# ActiveGL is documented as continuous "Active Gain Loss / pit gain-loss" and is a
# physical kick INDICATOR. The proxy below converts it into an experimental binary
# target. This is not authoritative ground truth; supervisor confirmation is required.
target:
  column: "ActiveGL"
  mode: "proxy_from_threshold"        # proxy_from_threshold | explicit_column
  rule: "ActiveGL > 0 bbl (pit gain rather than pit loss)"
  threshold: 0.0
  positive_label: 1
  negative_label: 0
  allow_proxy_training: true          # set false to STOP training until target is confirmed
  confirmation_required: true
  documented_kick_depth_ft: 12650.0
  documented_threshold_alternatives_ft: {1.0: 12650.7, 5.0: 12652.14}

# Columns removed from every model input. Rationale for each group is recorded in
# reports/data_audit.md and must be reviewed before changing this list.
features:
  excluded_columns:
    # Target source and its near-exact duplicate (ATVolume = ActiveGL + ~199.083).
    - "ActiveGL"
    - "ATVolume"
    # MRFlow = FIn - FOut exactly; the engineered Flow_Imbalance is used instead.
    - "MRFlow"
    # Scenario-specific depth variables: the simulator's kick is configured at
    # 12650 ft, so these would let a model memorise the experiment instead of
    # recognising physical kick precursors.
    - "WellDepth"
    - "BDepth"
    - "BTBR"
    # Formation pressure is the configured cause of the simulated kick and is not
    # a conventional real-time measured kick indicator; excluded from primary set.
    - "FPress"
    # Constant or near-constant in this single simulation run.
    - "CPress"
    - "MPS1"
    - "MPS2"
    - "MPS3"
    - "AMTD"
    - "STP"
    - "BSize"
  engineered:
    flow_imbalance: true              # Flow_Imbalance = FOut - FIn (verified sign convention)
    flow_imbalance_ratio: true        # Flow_Imbalance / FIn (relative imbalance)
  rolling:
    enabled: false                    # optional sequence-aware experiment
    window: 20
    columns: ["FOut", "DPPress", "HLoad"]
  scaler: "robust"                    # robust | standard
  imputer: "median"

split:
  strategy: "stratified_group_blocked"  # contiguous blocks keep adjacent samples together
  block_size: 25
  test_size: 0.2
  validation_size: 0.2                # fraction of training blocks used for threshold tuning
  purge_blocks: 1                     # drop blocks adjacent to the test blocks
  seed: 42

models:
  logistic_regression:
    enabled: true
    C: 1.0
    max_iter: 3000
    class_weight: "balanced"
  random_forest:
    enabled: true
    n_estimators: 300
    min_samples_leaf: 2
    max_depth: null
    class_weight: "balanced_subsample"
    n_jobs: -1
  xgboost:
    enabled: true
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    eval_metric: "logloss"
    n_jobs: -1
    fallback: "hist_gradient_boosting"  # used automatically if xgboost is unavailable
  isolation_forest:
    enabled: true
    n_estimators: 250
    max_samples: 256
    contamination: "auto"
    n_jobs: -1
  isolation_forest_normal_fit:
    enabled: true                   # fitted only on negative training rows (normal baseline)
  conventional_baseline:
    enabled: true
    indicator: "Flow_Imbalance"       # experimental threshold, tuned on validation only
    decision: "greater_than"

evaluation:
  positive_class_name: "Potential kick condition"
  negative_class_name: "Normal drilling condition"
  uncertainty_class_name: "Model uncertainty - review indicators"
  uncertainty_band: 0.05             # score within this distance of threshold is flagged
  decision_threshold: 0.5            # overridden per model by validation tuning
  tuning_metric: "f1"
  minimum_recall: 0.9                # operating points must reach >=90% validation kick recall
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
    - fpr
    - far

robustness:
  noise_levels: [0.01, 0.03, 0.05, 0.10]
  noise_type: "gaussian_relative_to_training_std"
  missing_levels: [0.05, 0.10, 0.20]
  missing_type: "mcar"
  seed: 42
  sensor_columns: ["FIn", "FOut", "DPPress", "HLoad", "FDensity", "MVis"]

explainability:
  enabled: true
  background_samples: 100
  top_features: 12

paths:
  models_dir: "models"
  results_dir: "results"
  figures_dir: "results/figures"
  explainability_dir: "results/explainability"
  predictions_dir: "results/predictions"
  reports_dir: "reports"
  comparison_csv: "results/model_comparison.csv"
  metrics_json: "results/metrics.json"
  bundle_path: "models/kick_detection_bundle.joblib"
